      try {
        var savedTheme = localStorage.getItem('deolinda_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
